name: Sign APK

on:
  workflow_dispatch:

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Android command line tools
        run: |
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mkdir -p $HOME/android-sdk/cmdline-tools
          mv cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Accept licenses and install build-tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "build-tools;34.0.0"
          sdkmanager --list_installed

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > karino.jks
          ls -la karino.jks
          file karino.jks

      - name: List repo files
        run: ls -la

      - name: Sign APK
        run: |
          APKSIGNER="$HOME/android-sdk/build-tools/34.0.0/apksigner"
          echo "Using: $APKSIGNER"
          chmod +x "$APKSIGNER"
          
          "$APKSIGNER" sign \
            --ks karino.jks \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --out karino-signed.apk \
            karino-unsigned.apk
          
          echo "✅ Signed successfully!"
          ls -la karino-signed.apk

      - name: Verify
        run: |
          "$HOME/android-sdk/build-tools/34.0.0/apksigner" verify --verbose karino-signed.apk || true

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: karino-signed-apk
          path: karino-signed.apk

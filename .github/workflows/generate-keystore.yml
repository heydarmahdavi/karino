name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore karino.jks \
            -alias karino \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass KarinoPass123 \
            -keypass KarinoPass123 \
            -dname "CN=Karino, OU=Dev, O=Karino, L=Tehran, ST=Tehran, C=IR"

      - name: Convert to base64
        run: |
          base64 karino.jks > karino-base64.txt
          echo "=== KEYSTORE BASE64 ==="
          cat karino-base64.txt
          echo ""
          echo "=== COPY THE TEXT ABOVE ==="

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: karino-keystore
          path: |
            karino.jks
            karino-base64.txt
